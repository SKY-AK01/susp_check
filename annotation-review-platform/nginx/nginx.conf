events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    upstream api {
        server backend:8000;
    }

    upstream ui {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Serve content-addressed images directly from disk (§22.6)
        # Requires an authenticated API token checked by the backend before
        # issuing an internal redirect — or use the /api/images/{id} proxy below.
        location /static-images/ {
            internal;
            alias /data/images/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # All API traffic
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            client_max_body_size 20M;   # chunk size guard; real chunked upload goes through API
        }

        # WebSocket / SSE for job progress
        location /ws/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Frontend SPA
        location / {
            proxy_pass http://ui;
            proxy_set_header Host $host;
            try_files $uri $uri/ /index.html;
        }
    }
}
